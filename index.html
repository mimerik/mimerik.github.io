<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>mimerik · проекты</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0b0f;
      letter-spacing: -0.02em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      cursor: default;
    }
    .background-wallpaper {
      position: fixed;
      inset: 0;
      background-image: url('https://i.giphy.com/dtRtziZF2px2skZV4J.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }
    .bg-liquid-glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: url(#displacementFilter) blur(2px);
      -webkit-backdrop-filter: url(#displacementFilter) blur(2px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.25), inset 0 0.5px 0 rgba(255, 255, 255, 0.25), inset 0 -0.5px 0 rgba(255, 255, 255, 0.05);
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      animation: glassPulse 6s infinite alternate ease-in-out;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1400px;
      margin: 0 auto;
      padding: 14px 0px;
    }
    .nickname {
      font-size: 20px;
      font-weight: 620;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .nickname:hover {
      transform: scale(1.02);
      color: rgba(255, 255, 255, 1);
    }
    .nav-links {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .nav-link {
      font-size: 16px;
      font-weight: 540;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.75);
      padding: 4px 0;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.4);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform: translateX(-50%);
      border-radius: 2px;
    }
    .nav-link:hover::after {
      width: 100%;
    }
    .nav-link:hover {
      color: #fff;
      transform: scale(1.04);
    }
    .nav-link.btn {
      padding: 8px 24px;
      border-radius: 40px;
      color: rgba(222, 222, 222, 0.92);
      font-weight: 570;
      background: rgba(2, 2, 2, 0.33);
      backdrop-filter: url(#displacementFilter) blur(2px);
      -webkit-backdrop-filter: url(#displacementFilter) blur(2px);
      border: 2px solid rgba(255, 255, 255, 0.10);
      font-size: 14px;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .nav-link.btn::after {
      display: none;
    }
    .nav-link.btn:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.42);
      border-color: rgba(255, 255, 255, 0.20);
      box-shadow: 0 8px 32px rgba(255, 255, 255, 0.10);
    }
    .nav-link.btn:active {
      transform: scale(0.94);
      transition-duration: 0.08s;
    }
    .main-content {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 28px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 80px;
      padding: 32px 40px;
      margin-left: 20px;
      margin-right: 20px;
      perspective: 1200px;
    }
    .card {
      width: 280px;
      height: 280px;
      border-radius: 32px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: url(#displacementFilter) blur(2px);
      -webkit-backdrop-filter: url(#displacementFilter) blur(2px);
      border: 2px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.25), inset 0 0.5px 0 rgba(255, 255, 255, 0.25), inset 0 -0.5px 0 rgba(255, 255, 255, 0.05);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, box-shadow;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 32px;
      background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.05) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      pointer-events: none;
    }
    .card:hover::before {
      opacity: 1;
    }
    .card:hover {
      transform: scale(1.04) translateY(-4px) rotateX(var(--rotateX, 0deg)) rotateY(var(--rotateY, 0deg));
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.40), inset 0 0.5px 0 rgba(255, 255, 255, 0.35), inset 0 -0.5px 0 rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.20);
    }
    .card:active {
      transform: scale(0.94) translateY(0px) rotateX(0deg) rotateY(0deg);
      transition-duration: 0.08s;
    }
    .card-content {
      text-align: center;
      padding: 20px 24px;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform: translateZ(20px);
      backface-visibility: hidden;
    }
    .card:hover .card-content {
      transform: scale(1.02) translateZ(30px);
    }
    .card-title {
      font-size: 28px;
      font-weight: 620;
      margin-bottom: 14px;
      letter-spacing: -0.03em;
      color: #fff;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .card:hover .card-title {
      text-shadow: 0 4px 32px rgba(0, 0, 0, 0.5);
    }
    .card-divider {
      width: 180px;
      height: 2px;
      margin: 0 auto 14px;
      background: rgba(255, 255, 255, 0.12);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card:hover .card-divider {
      width: 200px;
      background: rgba(255, 255, 255, 0.25);
    }
    .card-description {
      font-size: 17px;
      font-weight: 480;
      line-height: 1.6;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.2);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .card:hover .card-description {
      color: rgba(255, 255, 255, 1);
    }
    .socials-footer {
      position: fixed;
      bottom: 28px;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      gap: 28px;
      padding: 10px 24px;
      width: fit-content;
      margin: 0 auto;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }
    .social-link {
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      padding: 4px 8px;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.65);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      cursor: pointer;
    }
    .social-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.3);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform: translateX(-50%);
      border-radius: 2px;
    }
    .social-link:hover::after {
      width: 80%;
    }
    .social-link:hover {
      color: rgba(255, 255, 255, 0.95);
      transform: scale(1.08) translateY(-2px);
    }
    .social-link:active {
      transform: scale(0.92) translateY(0px);
      transition-duration: 0.08s;
    }
    @media (max-width: 700px) {
      .header-inner {
        padding: 8px 16px;
        flex-wrap: wrap;
        gap: 6px;
      }
      .nav-links {
        gap: 6px;
      }
      .nav-link {
        font-size: 12px;
      }
      .nav-link.btn {
        padding: 5px 14px;
        font-size: 12px;
      }
      .nickname {
        font-size: 15px;
      }
      .main-content {
        margin-top: 70px;
        gap: 16px;
        padding: 20px;
        margin-left: 12px;
        margin-right: 12px;
      }
      .card {
        width: 240px;
        height: 240px;
      }
      .card-title {
        font-size: 24px;
      }
      .socials-footer {
        gap: 16px;
        padding: 8px 16px;
        bottom: 16px;
        flex-wrap: wrap;
      }
      .social-link {
        font-size: 13px;
      }
    }
    @media (max-width: 480px) {
      .header-inner {
        flex-direction: column;
        align-items: center;
        padding: 6px 12px;
      }
      .nav-links {
        margin-top: 2px;
      }
      .card {
        width: 90vw;
        max-width: 260px;
        height: 90vw;
        max-height: 260px;
      }
      .card-content {
        padding: 16px 18px;
      }
      .socials-footer {
        gap: 12px;
        padding: 6px 12px;
      }
      .main-content {
        padding: 16px;
        margin-top: 60px;
      }
    }
  </style>
</head>

  <script>
    (function() {
      const cards = document.querySelectorAll('[data-parallax]');
      const bg = document.getElementById('bgWallpaper');
      const footer = document.getElementById('footer');
      let mouseX = 0;
      let mouseY = 0;
      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;

      function updateMouse(e) {
        const x = (e.clientX / window.innerWidth - 0.5) * 2;
        const y = (e.clientY / window.innerHeight - 0.5) * 2;
        targetX = x;
        targetY = y;
      }

      function animate() {
        currentX += (targetX - currentX) * 0.08;
        currentY += (targetY - currentY) * 0.08;
        cards.forEach((card) => {
          const rect = card.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const deltaX = (mouseX - centerX) / (window.innerWidth / 2);
          const deltaY = (mouseY - centerY) / (window.innerHeight / 2);
          const cardRotY = deltaX * -6;
          const cardRotX = deltaY * 6;
          card.style.setProperty('--rotateX', cardRotX + 'deg');
          card.style.setProperty('--rotateY', cardRotY + 'deg');
        });
        if (bg) {
          bg.style.transform = `translate(${currentX * -6}px, ${currentY * -6}px) scale(1.02)`;
        }
        if (footer) {
          footer.style.transform = `translate(${currentX * 2}px, ${currentY * 2}px)`;
        }
        requestAnimationFrame(animate);
      }

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        updateMouse(e);
      });
      animate();
    })();
  </script>
</body>
</html>
